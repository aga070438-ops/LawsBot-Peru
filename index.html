/* =========================================================
   MEMORIA LOCAL
========================================================= */

const STORAGE_KEY = "lawsbot_peru_memoria_v3";

let memory = {
  messages: [],
  lastTopic: null
};

try {

  const saved =
    JSON.parse(
      localStorage.getItem(STORAGE_KEY) || "null"
    );

  if (
    saved &&
    Array.isArray(saved.messages)
  ) {
    memory = saved;
  }

} catch(e) {}


/* =========================================================
   GUARDAR MEMORIA
========================================================= */

function saveMemory() {

  try {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(memory)
    );

  } catch(e) {}

}


/* =========================================================
   NORMALIZAR TEXTO
========================================================= */

function normalizeText(text) {

  return String(text || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[¿?¡!.,;:()[\]{}"']/g, " ")
    .replace(/[-_/]/g, " ")
    .replace(/\s+/g, " ")
    .trim();

}


function hasAny(q, arr) {

  return arr.some(
    x => q.includes(normalizeText(x))
  );

}


function hasAll(q, arr) {

  return arr.every(
    x => q.includes(normalizeText(x))
  );

}

const digital = {

derechosDigitales:
`Los derechos digitales son los derechos humanos y libertades que se ejercen, protegen o desarrollan en el entorno digital.

• No compartas códigos.

function articleResponse(q) {

  let m = q.match(
    /(?:articulo|artículo|art)\s*(?:numero|nro|n°|n|num)?\s*(\d{1,2})/i
  );

  if (!m) {
    m = q.match(
      /(?:derecho|derechos)\s*(?:humano|humanos)?\s*(\d{1,2})/i
    );
  }

  if (m) {

    const n = Number(m[1]);

    if (n >= 1 && n <= 30) {

      return (
        "📜 Artículo " +
        n +
        " de la Declaración Universal de los Derechos Humanos:\n\n" +
        humanRights[n] +
        "\n\nPuedes preguntarme también cómo se relaciona este artículo con Internet o con el contexto peruano."
      );

    }
  }

  return null;
}

}

        "⚖️ " +
        id.toUpperCase() +
        "\n\n" +
        rightsByTopic[id]
      );

    }

  }


  /* =====================================================
     MEMORIA / PREGUNTAS DE SEGUIMIENTO
  ===================================================== */

  if (
    hasAny(q, [
      "y eso",
      "y ese",
      "y esa",
      "y si",
      "y en peru",
      "y en perú",
      "como se aplica",
      "cómo se aplica",

      "explicame mas",
      "explícame más",
      "mas informacion",
      "más información",
      "puedes ampliar",
      "amplia",
      "amplía"
    ])
  ) {

    if (
      memory.lastTopic ===
      "derechosDigitales"
    )
      return digital.derechosDigitales;

    if (
      memory.lastTopic ===
      "privacidad"
    )
      return digital.privacidad;

    if (
      memory.lastTopic === "datos" ||
      memory.lastTopic === "datosSensibles"
    )
      return digital.datosSensibles;

    if (
      memory.lastTopic ===
      "arco"
    )
      return digital.arco;

    if (
      memory.lastTopic ===
      "ciberseguridad"
    )
      return digital.ciberseguridad;

    if (
      memory.lastTopic ===
      "phishing"
    )
      return digital.phishing;

    if (
      memory.lastTopic ===
      "ciberacoso"
    )
      return digital.ciberacoso;

    if (
      memory.lastTopic ===
      "sextorsion"
    )
      return digital.sextorsion;

    if (
      memory.lastTopic ===
      "grooming"
    )
      return digital.grooming;

    if (
      memory.lastTopic ===
      "olvido"
    )
      return digital.olvido;

    if (
      memory.lastTopic ===
      "neutralidad"
    )
      return digital.neutralidad;

    if (
      memory.lastTopic ===
      "huella"
    )
      return digital.huella;

    if (
      memory.lastTopic ===
      "identidad"
    )
      return digital.identidad;

    if (
      memory.lastTopic ===
      "convivencia"
    )
      return digital.convivencia;

  }


  /* =====================================================
     RESPUESTA FINAL
  ===================================================== */

  return `
No quiero darte una respuesta al azar 🤔.

Puedo ayudarte con preguntas como:

• ¿Cuáles son los derechos humanos?
• ¿Cuáles son los 30 artículos?

• ¿Qué hago si me hackearon Instagram?

También puedes contarme un caso concreto y trataré de identificar el tema.
`;
}


/* =========================================================
   MOSTRAR MENSAJES
========================================================= */

function addMessage(
  text,
  sender,
  save = true
) {

  const chat =
    document.getElementById("chat");

  const message =
    document.createElement("div");

  message.className =
    "message " + sender;

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    String(text).trim();

  message.appendChild(bubble);

  chat.appendChild(message);

  chat.scrollTop =
    chat.scrollHeight;


  if (save) {

    memory.messages.push({
      text: String(text),
      sender: sender
    });

    if (
      memory.messages.length > 80
    ) {

      memory.messages =
        memory.messages.slice(-80);

    }

    saveMemory();

  }

}


/* =========================================================
   RESTAURAR CONVERSACIÓN
========================================================= */

function restoreMemory() {

  if (
    memory.messages.length
  ) {

    memory.messages.forEach(
      m =>
        addMessage(
          m.text,
          m.sender,
          false
        )
    );

    document.getElementById(
      "memoryStatus"
    ).textContent =
      "Memoria local restaurada ✓";

  } else {

    addMessage(
`¡Hola! 👋🇵🇪 Soy LawsBot Perú.

Ahora puedo orientarte sobre:

⚖️ Derechos humanos.
📜 Los 30 artículos de la DUDH.
💻 Derechos digitales.
🔐 Privacidad.
📋 Protección de datos.
🛡️ Ciberseguridad.
🤝 Convivencia digital.

Puedes preguntarme algo directamente o contarme un caso concreto. 💙`,
      "bot"
    );

  }

}


/* =========================================================
   ENVIAR
========================================================= */

function sendMessage() {

  const input =
    document.getElementById(
      "userInput"
    );

  const text =
    input.value.trim();

  if (!text) return;


  addMessage(
    text,
    "user"
  );

  input.value = "";


  setTimeout(() => {

    const response =
      getBotResponse(text);

    addMessage(
      response,
      "bot"
    );

  }, 250);

}


/* =========================================================
   BOTONES RÁPIDOS
========================================================= */

function quickQuestion(q) {

  const input =
    document.getElementById(
      "userInput"
    );

  input.value = q;

  sendMessage();

}


/* =========================================================
   BORRAR MEMORIA
========================================================= */

function clearMemory() {

  const ok =
    confirm(
      "¿Borrar la conversación guardada en este navegador?"
    );

  if (!ok) return;


  memory = {
    messages: [],
    lastTopic: null
  };

  localStorage.removeItem(
    STORAGE_KEY
  );

  document.getElementById(
    "chat"
  ).innerHTML = "";

  document.getElementById(
    "memoryStatus"
  ).textContent =
    "Memoria local activa";

  addMessage(
    "Memoria local borrada. Empecemos de nuevo. 💙",
    "bot"
  );

}


/* =========================================================
   ENTER PARA ENVIAR
========================================================= */

document
  .getElementById("userInput")
  .addEventListener(
    "keydown",
    function(e) {

      if (
        e.key === "Enter" &&
        !e.shiftKey
      ) {

        e.preventDefault();

        sendMessage();

      }

    }
  );


/* =========================================================
   INICIAR
========================================================= */

restoreMemory();

</script>
