<head>

<style>

*{
  box-sizing:border-box;

  padding:0;
}

body{

  background:linear-gradient(135deg,#eef2ff,#f8f9ff);

}

.app{

  max-width:1050px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* =========================
   ENCABEZADO
========================= */

.header{
  background:linear-gradient(135deg,#2447d8,#6d5dfc);

  padding:20px;
  display:flex;
  align-items:center;
  gap:16px;

}

.logo{

  height:65px;

  padding:3px;

}

.header-text h1{
  font-size:25px;
  margin-bottom:5px;
}

.header-text p{

  opacity:.92;
}

/* =========================
   CONTENEDOR
========================= */

.chat-container{
  flex:1;
  display:flex;
  flex-direction:column;
  background:white;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
}

   BARRA DE ESTADO
========================= */

.status{
  padding:10px 18px;
  background:#f8faff;

  justify-content:space-between;
  align-items:center;

  color:#667085;
}

.status-left{
  display:flex;
  align-items:center;

}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#22c55e;
}

/* =========================
   CHAT
========================= */

.chat{
  flex:1;
  padding:22px;
  overflow-y:auto;
  min-height:500px;
  max-height:calc(100vh - 260px);
  scroll-behavior:smooth;
}

.message{
  display:flex;
  margin-bottom:16px;
  animation:appear .2s ease;
}

@keyframes appear{
  from{
    opacity:0;
    transform:translateY(5px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.message.user{
  justify-content:flex-end;
}

.bubble{
  max-width:82%;

  border-radius:18px;
  line-height:1.55;
  font-size:14px;
  word-wrap:break-word;
}

.bot .bubble{
  background:#eef2ff;
  color:#1f2937;
  border-bottom-left-radius:5px;
}

.user .bubble{
  background:#2447d8;
  color:white;
  border-bottom-right-radius:5px;
}

.source{
  margin-top:10px;
  padding-top:8px;
  border-top:1px solid rgba(0,0,0,.08);
  font-size:11px;

  line-height:1.4;
}

.user .source{

}

/* =========================
   BIENVENIDA
========================= */

.welcome-card{
  background:linear-gradient(135deg,#f5f7ff,#ffffff);
  border:1px solid #dce3ff;
  border-radius:18px;
  padding:18px;
  margin-bottom:20px;
}

.welcome-card h2{
  color:#2447d8;
  margin-bottom:8px;
  font-size:20px;
}

.welcome-card p{
  font-size:14px;
  line-height:1.6;
  color:#475467;
}

/* =========================
   SUGERENCIAS
========================= */

.suggestions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:14px;
}

.suggestion{
  border:1px solid #cfd7ff;
  background:white;
  color:#2447d8;
  padding:8px 12px;
  border-radius:999px;
  cursor:pointer;
  font-size:12px;
  transition:.2s;
}

.suggestion:hover{
  background:#eef2ff;
  transform:translateY(-1px);
}

/* =========================
   TYPING
========================= */

.typing{
  display:flex;
  gap:4px;
  align-items:center;
  padding:5px;
}

.typing span{
  width:7px;
  height:7px;
  background:#7180d8;
  border-radius:50%;
  animation:typing 1s infinite;
}

.typing span:nth-child(2){
  animation-delay:.15s;
}

.typing span:nth-child(3){
  animation-delay:.3s;
}

@keyframes typing{
  0%,60%,100%{
    transform:translateY(0);
    opacity:.4;
  }
  30%{
    transform:translateY(-4px);
    opacity:1;
  }
}

/* =========================
   INPUT
========================= */

.input-area{
  padding:15px;
  border-top:1px solid #e5e7eb;
  background:white;
}

.input-row{
  display:flex;
  gap:10px;
}

.input{
  flex:1;
  border:1px solid #d0d5dd;

  padding:13px 15px;

  font-size:14px;

}

.input:focus{

}

.send{

  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#2447d8,#6d5dfc);
  color:white;
  cursor:pointer;
  font-size:19px;
  transition:.2s;
}

.send:hover{
  transform:scale(1.04);
}

.send:disabled{
  opacity:.5;

}

/* =========================
   BOTONES
========================= */

.actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:9px;
}

.clear-memory{

  color:#667085;
  font-size:11px;
  cursor:pointer;
}

.clear-memory:hover{

}

.counter{

  color:#98a2b3;

/* =========================
   RESPONSIVE
========================= */

@media(max-width:650px){

    padding:15px;
  }

  .logo{

  }

  .header-text h1{

  }

  .chat{
    padding:14px;

  }

<body>

<div class="app">

  <header class="header">

    <!-- NO CAMBIES ESTE NOMBRE -->
    <img
      src="Logo.jpg.jpeg"
      class="logo"
      alt="Logo de LawsBot Perú"
    >

    <div class="header-text">
      <h1>LawsBot Perú</h1>
      <p>Derechos digitales · Privacidad · Ciberseguridad</p>
    </div>

  </header>

  <div class="chat-container">

    <div class="status">

      <div class="status-left">
        <span class="status-dot"></span>
        <span>Memoria local activa</span>
      </div>

      </span>

    </div>

        <textarea

          id="sendButton"
          class="send"
          onclick="enviarMensaje()"
          aria-label="Enviar"
        >

          onclick="borrarMemoria()"
        >

</div>

<script>

/* =========================================================
   LAWSBOT PERÚ
   SISTEMA DE MEMORIA + RECONOCIMIENTO DE TEMAS
========================================================= */

const STORAGE_KEY = "lawsbot_peru_memoria_v3";


/* =========================================================
   MEMORIA
========================================================= */

let memoria = cargarMemoria();


function memoriaInicial(){

  return {

    historial: [],

    tema: "",

    subtema: "",

    ultimoPregunta: "",

    ultimoIntent: "",

    caso: "",

    plataforma: "",

    nombre: "",

    actualizado: Date.now()

  };

}


function cargarMemoria(){

  try{

    const guardado = localStorage.getItem(STORAGE_KEY);

    if(!guardado){
      return memoriaInicial();
    }

    const datos = JSON.parse(guardado);

    return {
      ...memoriaInicial(),
      ...datos,
      historial: Array.isArray(datos.historial)
        ? datos.historial
        : []
    };

  }catch(error){

    return memoriaInicial();

  }

}


function guardarMemoria(){

  memoria.actualizado = Date.now();

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(memoria)
    );

  }catch(error){

    console.warn("No se pudo guardar la memoria local.");

  }

}


/* =========================================================
   NORMALIZACIÓN
========================================================= */

function normalizar(texto){

  return String(texto || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[¿?¡!.,;:()"']/g," ")
    .replace(/\s+/g," ")
    .trim();

}


/* =========================================================
   SEGURIDAD PARA MOSTRAR TEXTO DEL USUARIO
========================================================= */

function escaparHTML(texto){

  return String(texto || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   MOSTRAR MENSAJES
========================================================= */

function agregarMensaje(tipo, contenido, guardar=true){

  const chat = document.getElementById("chat");

  const contenedor = document.createElement("div");

  contenedor.className =
    "message " + (tipo === "user" ? "user" : "bot");

  const burbuja = document.createElement("div");

  burbuja.className = "bubble";

  burbuja.innerHTML = contenido;

  contenedor.appendChild(burbuja);

  chat.appendChild(contenedor);

  chat.scrollTop = chat.scrollHeight;

  if(guardar){

    memoria.historial.push({

      tipo: tipo,

      contenido:
        tipo === "user"
          ? escaparHTML(contenido)
          : contenido,

      fecha: Date.now()

    });

    /*
      Guardamos las últimas 100 interacciones
      para no llenar el almacenamiento del navegador.
    */

    if(memoria.historial.length > 100){

      memoria.historial =
        memoria.historial.slice(-100);

    }

    guardarMemoria();

  }

  actualizarEstado();

}


/* =========================================================
   CARGAR HISTORIAL
========================================================= */

function cargarHistorial(){

  const chat =
    document.getElementById("chat");

  chat.innerHTML = "";

  if(memoria.historial.length === 0){

    mostrarBienvenida();

    return;

  }

  memoria.historial.forEach(mensaje => {

    agregarMensaje(
      mensaje.tipo,
      mensaje.contenido,
      false
    );

  });

  actualizarEstado();

}


/* =========================================================
   BIENVENIDA
========================================================= */

function mostrarBienvenida(){

  const contenido = `

    <div class="welcome-card">

      <h2>👋 ¡Hola! Soy LawsBot Perú</h2>

      <p>
        Soy un asistente informativo especializado en
        <strong>derechos digitales, privacidad,
        protección de datos, ciberseguridad y
        convivencia digital</strong> en el contexto peruano.
      </p>

      <br>

      <p>
        Puedes preguntarme de distintas maneras.
        No necesitas utilizar una frase exacta.
        También puedo mantener el contexto de la
        conversación mediante memoria local.
      </p>

      <div class="suggestions">

        <button
          class="suggestion"
          onclick="preguntaRapida('¿Cuáles son los derechos digitales?')"
        >
          ⚖️ Derechos digitales
        </button>

        <button
          class="suggestion"
          onclick="preguntaRapida('¿Qué es la privacidad digital?')"
        >
          🔒 Privacidad
        </button>

        <button
          class="suggestion"
          onclick="preguntaRapida('¿Qué son los datos personales?')"
        >
          👤 Datos personales
        </button>

        <button
          class="suggestion"
          onclick="preguntaRapida('¿Qué es la ciberseguridad?')"
        >
          🛡️ Ciberseguridad
        </button>

        <button
          class="suggestion"
          onclick="preguntaRapida('¿Qué son los derechos ARCO?')"
        >
          📋 Derechos ARCO
        </button>

        <button
          class="suggestion"
          onclick="preguntaRapida('Me hackearon Instagram, ¿qué hago?')"
        >
          📱 Instagram hackeado
        </button>

      </div>

    </div>

  `;

  agregarMensaje(
    "bot",
    contenido,
    true
  );

}


/* =========================================================
   FUENTES
========================================================= */

function fuente(texto){

  return `

    <div class="source">

      📚 <strong>Fundamento / referencia:</strong>
      ${texto}

    </div>

  `;

}


/* =========================================================
   REGISTRAR CONTEXTO
========================================================= */

function actualizarContexto(
  texto,
  intent
){

  const p = normalizar(texto);

  memoria.ultimoPregunta = texto;

  memoria.ultimoIntent = intent;

  /* DERECHOS */

  if(
    intent === "derechos_digitales" ||
    intent === "lista_derechos"
  ){

    memoria.tema =
      "derechos digitales";

  }

  /* PRIVACIDAD */

  if(intent === "privacidad"){

    memoria.tema =
      "privacidad";

  }

  /* DATOS */

  if(
    intent === "datos_personales" ||
    intent === "datos_sensibles" ||
    intent === "comparar_datos"
  ){

    memoria.tema =
      "datos personales";

  }

  /* ARCO */

  if(
    intent === "arco" ||
    intent === "acceso" ||
    intent === "rectificacion" ||
    intent === "cancelacion" ||
    intent === "oposicion"
  ){

    memoria.tema =
      "derechos ARCO";

  }

  /* CIBERSEGURIDAD */

  if(
    intent === "ciberseguridad" ||
    intent === "seguridad_digital"
  ){

    memoria.tema =
      "ciberseguridad";

  }

  /* INSTAGRAM */

  if(
    p.includes("instagram") ||
    p.includes("ig") &&
    (
      p.includes("hack") ||
      p.includes("robar") ||
      p.includes("cuenta")
    )
  ){

    memoria.tema =
      "instagram";

    memoria.subtema =
      "cuenta comprometida";

    memoria.plataforma =
      "Instagram";

  }

  /* CUENTA COMPROMETIDA */

  if(intent === "cuenta_hackeada"){

    memoria.tema =
      "ciberseguridad";

    memoria.subtema =
      "cuenta comprometida";

    memoria.caso =
      texto;

  }

  /* PHISHING */

  if(intent === "phishing"){

    memoria.tema =
      "ciberseguridad";

    memoria.subtema =
      "phishing";

  }

  /* CIBERBULLYING */

  if(intent === "ciberbullying"){

    memoria.tema =
      "convivencia digital";

    memoria.subtema =
      "ciberbullying";

  }

  /* SUPLANTACIÓN */

  if(intent === "suplantacion"){

    memoria.tema =
      "identidad digital";

    memoria.subtema =
      "suplantación de identidad";

  }

  /* AMENAZAS */

  if(intent === "amenazas"){

    memoria.tema =
      "seguridad digital";

    memoria.subtema =
      "amenazas digitales";

  }

  guardarMemoria();

}


/* =========================================================
   DETECTAR SEGUIMIENTO
========================================================= */

function esSeguimiento(p){

  const frases = [

    "y si",

    "y que pasa",

    "y ahora",

    "y ahora que hago",

    "que hago ahora",

    "y como",

    "y entonces",

    "y despues",

    "y eso",

    "en ese caso",

    "y si pasa",

    "que hago en ese caso",

    "y si la empresa",

    "y si cambiaron",

    "pero y si",

    "y si ya"

  ];

  return frases.some(frase =>
    p.startsWith(frase) ||
    p.includes(" " + frase)
  );

}


/* =========================================================
   DETECTAR INTENCIÓN
========================================================= */

function detectarIntento(texto){

  const p = normalizar(texto);


  /* =========================
     SALUDOS
  ========================= */

  if(
    /^(hola|holaa|holaaa|buenas|buenos dias|buenas tardes|buenas noches|hey|hello)/.test(p)
  ){

    return "saludo";

  }


  /* =========================
     FUNCIÓN DEL BOT
  ========================= */

  if(
    p.includes("cual es tu funcion") ||
    p.includes("que haces") ||
    p.includes("para que sirves") ||
    p.includes("que puedes hacer") ||
    p.includes("quien eres") ||
    p.includes("como puedes ayudarme")
  ){

    return "funcion";

  }


  /* =========================
     10 / LISTA DE DERECHOS
  ========================= */

  if(

    p.includes("10 derechos digitales") ||
    p.includes("diez derechos digitales") ||

    p.includes("cuales son los derechos digitales") ||

    p.includes("cuales son los principales derechos digitales") ||

    p.includes("que derechos digitales existen") ||

    p.includes("que derechos tenemos en internet") ||

    p.includes("dime los derechos digitales") ||

    p.includes("menciona los derechos digitales") ||

    p.includes("enumera los derechos digitales") ||

    p.includes("lista de derechos digitales") ||

    p.includes("lista de los derechos digitales") ||

    p.includes("principales derechos digitales") ||

    p.includes("derechos digitales principales") ||

    p.includes("derechos que tenemos en internet") ||

    p.includes("derechos en internet")

  ){

    return "lista_derechos";

  }


  /* =========================
     DEFINICIÓN DERECHOS
  ========================= */

  if(

    p.includes("que son los derechos digitales") ||
    p.includes("que significa derechos digitales") ||
    p.includes("define derechos digitales") ||
    p.includes("definicion de derechos digitales") ||
    p.includes("para que sirven los derechos digitales")

  ){

    return "derechos_digitales";

  }


  /* =========================
     PRIVACIDAD
  ========================= */

  if(

    p.includes("privacidad digital") ||
    p.includes("privacidad en internet") ||
    p.includes("privacidad online") ||
    p.includes("privacidad en redes") ||
    p.includes("que es la privacidad") ||
    p.includes("que significa privacidad digital") ||
    p.includes("define privacidad")

  ){

    return "privacidad";

  }


  if(

    p.includes("como proteger mi privacidad") ||
    p.includes("como cuidar mi privacidad") ||
    p.includes("como proteger mis datos en internet") ||
    p.includes("como tener privacidad en internet")

  ){

    return "proteger_privacidad";

  }


  /* =========================
     DATOS PERSONALES
  ========================= */

  if(

    p.includes("diferencia entre datos personales y datos sensibles") ||
    p.includes("diferencia datos personales datos sensibles") ||
    p.includes("en que se diferencian los datos personales y sensibles") ||
    p.includes("cual es la diferencia entre datos personales y sensibles")

  ){

    return "comparar_datos";

  }


  if(

    p.includes("datos sensibles") ||
    p.includes("dato sensible") ||
    p.includes("que son los datos sensibles") ||
    p.includes("ejemplos de datos sensibles")

  ){

    return "datos_sensibles";

  }


  if(

    p.includes("datos personales") ||
    p.includes("dato personal") ||
    p.includes("que son los datos personales") ||
    p.includes("ejemplos de datos personales") ||
    p.includes("que informacion es un dato personal")

  ){

    return "datos_personales";

  }


  /* =========================
     PROTECCIÓN DE DATOS
  ========================= */

  if(

    p.includes("proteccion de datos") ||
    p.includes("proteger mis datos") ||
    p.includes("derecho a la proteccion de datos") ||
    p.includes("que es la proteccion de datos")

  ){

    return "proteccion_datos";

  }


  /* =========================
     CONSENTIMIENTO
  ========================= */

  if(

    p.includes("consentimiento para usar mis datos") ||
    p.includes("consentimiento de datos") ||
    p.includes("pueden usar mis datos sin permiso") ||
    p.includes("pueden usar mis datos sin mi permiso")

  ){

    return "consentimiento";

  }


  /* =========================
     ARCO
  ========================= */

  if(

    p.includes("derechos arco") ||
    p.includes("que son los arco") ||
    p.includes("que significa arco") ||
    p.includes("acceso rectificacion cancelacion oposicion")

  ){

    return "arco";

  }


  /* =========================
     ACCESO
  ========================= */

  if(

    p.includes("derecho de acceso") ||
    p.includes("como puedo acceder a mis datos") ||
    p.includes("quiero saber que datos tienen de mi")

  ){

    return "acceso";

  }


  /* =========================
     RECTIFICACIÓN
  ========================= */

  if(

    p.includes("derecho de rectificacion") ||
    p.includes("rectificar mis datos") ||
    p.includes("corregir mis datos") ||
    p.includes("datos incorrectos")

  ){

    return "rectificacion";

  }


  /* =========================
     CANCELACIÓN
  ========================= */

  if(

    p.includes("derecho de cancelacion") ||
    p.includes("cancelar mis datos") ||
    p.includes("eliminar mis datos") ||
    p.includes("borrar mis datos personales")

  ){

    return "cancelacion";

  }


  /* =========================
     OPOSICIÓN
  ========================= */

  if(

    p.includes("derecho de oposicion") ||
    p.includes("oponerme al uso de mis datos") ||
    p.includes("no quiero que usen mis datos")

  ){

    return "oposicion";

  }


  /* =========================
     CIBERSEGURIDAD
  ========================= */

  if(

    p.includes("que es la ciberseguridad") ||
    p.includes("que significa ciberseguridad") ||
    p.includes("define ciberseguridad") ||
    p.includes("para que sirve la ciberseguridad") ||
    p.includes("que es seguridad informatica")

  ){

    return "ciberseguridad";

  }


  /* =========================
     SEGURIDAD DIGITAL
  ========================= */

      Es la Ley de Protección de Datos Personales
      del Perú.

      <br><br>

      Su finalidad es garantizar el derecho fundamental
      a la protección de los datos personales mediante
      un tratamiento adecuado.

      <br><br>

      Su Reglamento vigente está aprobado mediante
      el D.S. N.° 016-2024-JUS.

      ${fuente(
        "Ley N.° 29733 y D.S. N.° 016-2024-JUS."
      )}

    `;

  }


  if(

    p.includes("ley de delitos informaticos") ||
    p.includes("ley 30096") ||
    p.includes("30096")

  ){

    return `

      <strong>💻 Ley N.° 30096</strong>

      <br><br>

      Es la Ley de Delitos Informáticos del Perú.

      <br><br>

      Su objetivo es prevenir y sancionar conductas
      ilícitas que afectan sistemas y datos informáticos
      y otros bienes jurídicos relevantes mediante
      tecnologías de la información o comunicación.

      ${fuente(
        "Ley N.° 30096, Ley de Delitos Informáticos."
      )}

    `;

  }


  /* =====================================================
     FALLBACK INTELIGENTE
  ===================================================== */

  if(memoria.tema){

    return `

      💙 Entiendo tu pregunta, y quiero relacionarla
      con lo que veníamos hablando.

      <br><br>

      Hasta ahora el tema de la conversación es:
      <strong>${escaparHTML(memoria.tema)}</strong>.

      <br><br>

      Puedes formular la pregunta de otra manera
      o decirme directamente qué situación tienes.

      <br><br>

      Por ejemplo:

      <br>

      “¿Qué significa?”
      <br>
      “¿Qué derechos tengo?”
      <br>
      “¿Qué puedo hacer?”
      <br>
      “¿Y si ocurrió en Instagram?”
      <br>
      “¿Cuál es la diferencia?”

    `;

  }


  return `

    💙 Puedo ayudarte con esa pregunta.

    <br><br>

    Prueba escribiéndola de una de estas formas:

    <br><br>

    • “¿Qué son los derechos digitales?”
    <br>
    • “¿Cuáles son los derechos digitales?”
    <br>
    • “¿Qué es la privacidad digital?”
    <br>
    • “¿Qué son los datos personales?”
    <br>
    • “¿Qué diferencia hay entre datos personales
      y datos sensibles?”
    <br>
    • “¿Qué son los derechos ARCO?”
    <br>
    • “¿Qué es la ciberseguridad?”
    <br>
    • “Me hackearon Instagram, ¿qué hago?”

    <br><br>

    También puedes contarme directamente una situación
    y trataré de identificar el tema.

  `;

}


/* =========================================================
   ENVIAR MENSAJE
========================================================= */

function enviarMensaje(){

  const input =
    document.getElementById("userInput");

  const texto =
    input.value.trim();

  if(!texto){
    return;
  }

  agregarMensaje(
    "user",
    escaparHTML(texto),
    true
  );

  input.value = "";

  ajustarTextarea();

  const typing =
    document.createElement("div");

  typing.className =
    "message bot";

  typing.id =
    "typingIndicator";

  typing.innerHTML = `

    <div class="bubble">

      <div class="typing">

        <span></span>
        <span></span>
        <span></span>

      </div>

    </div>

  `;

  document
    .getElementById("chat")
    .appendChild(typing);

  document
    .getElementById("chat")
    .scrollTop =
      document.getElementById("chat").scrollHeight;


  setTimeout(() => {

    const indicador =
      document.getElementById(
        "typingIndicator"
      );

    if(indicador){
      indicador.remove();
    }

    const respuesta =
      responder(texto);

    agregarMensaje(
      "bot",
      respuesta,
      true
    );

  }, 300);

}


/* =========================================================
   PREGUNTAS RÁPIDAS
========================================================= */

function preguntaRapida(texto){

  const input =
    document.getElementById("userInput");

  input.value =
    texto;

  enviarMensaje();

}


/* =========================================================
   BORRAR MEMORIA
========================================================= */

function borrarMemoria(){

  const confirmar =
    confirm(
      "¿Quieres borrar el historial y la memoria de LawsBot en este navegador?"
    );

  if(!confirmar){
    return;
  }

  localStorage.removeItem(
    STORAGE_KEY
  );

  memoria =
    memoriaInicial();

  document
    .getElementById("chat")
    .innerHTML = "";

  mostrarBienvenida();

  actualizarEstado();

}


/* =========================================================
   ESTADO
========================================================= */

function actualizarEstado(){

  const status =
    document.getElementById(
      "memoryStatus"
    );

  const counter =
    document.getElementById(
      "counter"
    );

  if(memoria.historial.length === 0){

    status.textContent =
      "Conversación nueva";

  }else{

    status.textContent =
      `${memoria.historial.length} mensajes guardados`;

  }

  counter.textContent =
    `Tema: ${memoria.tema || "general"}`;

}


/* =========================================================
   TEXTAREA AUTOMÁTICO
========================================================= */

function ajustarTextarea(){

  const input =
    document.getElementById(
      "userInput"
    );

  input.style.height =
    "auto";

  input.style.height =
    Math.min(
      input.scrollHeight,
      120
    ) + "px";

}


/* =========================================================
   ENTER PARA ENVIAR
========================================================= */

document
  .getElementById("userInput")
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter" &&
        !event.shiftKey
      ){

        event.preventDefault();

        enviarMensaje();

      }

    }
  );


document
  .getElementById("userInput")
  .addEventListener(
    "input",
    ajustarTextarea
  );


/* =========================================================
   INICIAR
========================================================= */

window.addEventListener(
  "load",
  function(){

    cargarHistorial();

    actualizarEstado();

  }
);

</script>
