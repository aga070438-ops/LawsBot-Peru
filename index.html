<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LawsBot Perú</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #eef4ff, #f8faff);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 850px;
      height: 90vh;
      min-height: 600px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 15px 50px rgba(0,0,0,.12);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, #173b8f, #2563eb);
      color: white;
      padding: 22px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: white;
      color: #2563eb;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 26px;
      font-weight: bold;
    }

    header h1 {
      font-size: 22px;
      margin-bottom: 4px;
    }

    header p {
      font-size: 13px;
      opacity: .9;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      background: #f8faff;
    }

    .message {
      display: flex;
      margin-bottom: 18px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 78%;
      padding: 14px 17px;
      border-radius: 18px;
      line-height: 1.5;
      font-size: 15px;
      word-wrap: break-word;
    }

    .bot .bubble {
      background: white;
      color: #172033;
      border: 1px solid #e4e9f3;
      border-bottom-left-radius: 5px;
    }

    .user .bubble {
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 5px;
    }

    .bubble a {
      color: #2563eb;
      font-weight: bold;
      text-decoration: none;
    }

    .bubble a:hover {
      text-decoration: underline;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .chip {
      background: white;
      border: 1px solid #cbd5e1;
      color: #173b8f;
      border-radius: 20px;
      padding: 9px 13px;
      cursor: pointer;
      font-size: 13px;
      transition: .2s;
    }

    .chip:hover {
      background: #eef4ff;
      transform: translateY(-1px);
    }

    .typing {
      display: none;
      padding: 0 24px 10px;
      color: #64748b;
      font-size: 13px;
    }

    .typing span {
      display: inline-block;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% {
        opacity: .3;
      }

      50% {
        opacity: 1;
      }
    }

    .input-area {
      border-top: 1px solid #e5e7eb;
      padding: 15px;
      background: white;
      display: flex;
      gap: 10px;
    }

    #input {
      flex: 1;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      padding: 13px 15px;
      font-size: 15px;
      outline: none;
    }

    #input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.1);
    }

    #send {
      border: none;
      background: #2563eb;
      color: white;
      border-radius: 14px;
      padding: 0 20px;
      cursor: pointer;
      font-weight: bold;
      transition: .2s;
    }

    #send:hover {
      background: #173b8f;
    }

    .source {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #e5e7eb;
      font-size: 12px;
      color: #64748b;
    }

    .context {
      font-size: 11px;
      color: #64748b;
      margin: 0 24px 8px;
      display: none;
    }

    @media (max-width: 600px) {
      body {
        padding: 0;
      }

      .app {
        height: 100vh;
        border-radius: 0;
      }

      .bubble {
        max-width: 88%;
      }

      header {
        padding: 17px;
      }

      #chat {
        padding: 17px;
      }
    }
  </style>
</head>

<body>

<div class="app">

/* =========================================================

let conversation = {

/* =========================================================

/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapeHTML(text) {

  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   CONVERTIR URLS EN ENLACES
========================================================= */

function makeLinks(text) {

  return text.replace(

    /(https?:\/\/[^\s<]+)/g,

    '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'

  );

}


/* =========================================================
   AGREGAR MENSAJE
========================================================= */

function addMessage(text, type = "bot", source = null) {

  const wrapper = document.createElement("div");

  wrapper.className = "message " + type;

  const bubble = document.createElement("div");

  bubble.className = "bubble";


  /*
    Los mensajes del BOT pueden utilizar HTML controlado
    para mostrar negrita y saltos de línea.

    Los mensajes del USUARIO se muestran como texto
    para evitar interpretar HTML.
  */

  if (type === "bot") {

    bubble.innerHTML = text;

  } else {

    bubble.textContent = text;

  }


  /* FUENTE */

  if (source) {

    const sourceBox = document.createElement("div");

    sourceBox.className = "source";

    sourceBox.innerHTML =
      "Fuente: " +
      '<a href="' +
      source.url +
      '" target="_blank" rel="noopener noreferrer">' +
      escapeHTML(source.title) +
      "</a>";

    bubble.appendChild(sourceBox);

  }


  wrapper.appendChild(bubble);

  chat.appendChild(wrapper);

  chat.scrollTop = chat.scrollHeight;

}


/* =========================================================
   ESCRIBIENDO
========================================================= */

function showTyping() {

  typing.style.display = "block";

  chat.scrollTop = chat.scrollHeight;

}


function hideTyping() {

  typing.style.display = "none";

/* =========================================================
   MOSTRAR CONTEXTO
========================================================= */

function updateContext() {

  if (!conversation.currentTopic) {

    contextBox.style.display = "none";

    return;

  }


  const topicNames = {

    hackeo: "Cuenta comprometida",

    imagenIntima: "Imágenes íntimas",

    denuncia: "Denuncia",

    seguridad: "Ciberseguridad",

    convivencia: "Convivencia digital",

    derechos: "Derechos digitales"

  };


  let text =
    "Tema actual: " +
    (topicNames[conversation.currentTopic] ||
    conversation.currentTopic);


  if (conversation.platform) {

    text += " · " + conversation.platform;

  }


  contextBox.textContent = text;

  contextBox.style.display = "block";

}


/* =========================================================
   NORMALIZAR
========================================================= */

function normalize(text) {

  return text

    .toLowerCase()

    .normalize("NFD")

    .replace(/[\u0300-\u036f]/g, "")

    .replace(/[¿?¡!.,;:()[\]{}"]/g, " ")

    .replace(/\s+/g, " ")

    .trim();

}


/* =========================================================
   DETECTAR PLATAFORMA
========================================================= */

function detectPlatform(text) {

  const t = normalize(text);


  if (/\b(instagram|ig)\b/.test(t)) {

    return "Instagram";

  }


  if (/\b(facebook|fb)\b/.test(t)) {

    return "Facebook";

  }


  if (/\b(tiktok|tik tok)\b/.test(t)) {

    return "TikTok";

  }


  if (/\b(whatsapp|wasap|wsp)\b/.test(t)) {

    return "WhatsApp";

  }


  if (/\b(snapchat)\b/.test(t)) {

    return "Snapchat";

  }


  if (/\b(discord)\b/.test(t)) {

    return "Discord";

  }


  if (/\b(twitter|x)\b/.test(t)) {

    return "X";

  }


  return null;

}

  /* EXTORSIÓN */

  /* PHISHING */

  for (const topic in scores) {

/* =========================================================
   ACTUALIZAR DETALLES
========================================================= */

function updateDetails(text) {

  const t = normalize(text);


  if (

    t.includes("hackearon") ||

    t.includes("me hackearon") ||

    t.includes("entraron a mi cuenta") ||

    t.includes("robaron mi cuenta")

  ) {

    conversation.details.accountHacked = true;

  }


  if (

    t.includes("cambiaron mi correo") ||

    t.includes("cambiaron el correo") ||

    t.includes("cambiaron mi email")

  ) {

    conversation.details.emailChanged = true;

  }


  if (

    t.includes("cambiaron mi contrasena") ||

    t.includes("cambiaron la contrasena")

  ) {

    conversation.details.passwordChanged = true;

  }


  if (

    t.includes("2fa") ||

    t.includes("verificacion en dos pasos")

  ) {

    conversation.details.twoFactor = true;

  }


  if (

    t.includes("foto intima") ||

    t.includes("fotos intimas") ||

    t.includes("video intimo") ||

    t.includes("nudes") ||

    t.includes("pack")

  ) {

    conversation.details.intimateImages = true;

  }


  if (

    t.includes("amenazan") ||

    t.includes("amenaza") ||

    t.includes("chantaje") ||

    t.includes("extorsion")

  ) {

    conversation.details.threatened = true;

  }


  if (

    t.includes("cuenta falsa") ||

    t.includes("perfil falso") ||

    t.includes("se hacen pasar por mi")

  ) {

    conversation.details.impersonation = true;

  }


  if (

    t.includes("acoso") ||

    t.includes("bullying") ||

    t.includes("ciberbullying")

  ) {

    conversation.details.harassment = true;

  }


  if (

    t.includes("phishing") ||

    t.includes("link falso") ||

    t.includes("enlace falso")

  ) {

    conversation.details.phishing = true;

  }


  if (

    t.includes("datos personales") ||

    t.includes("mis datos")

  ) {

    conversation.details.dataProblem = true;

  }

/* =========================================================
   PREGUNTA CONTEXTUAL
========================================================= */

function isContextualQuestion(text) {

  const t = normalize(text);


  const contextualWords = [

    "y si",

    "y que pasa si",

    "y ahora",

    "entonces",

    "tambien",

    "eso",

    "esa cuenta",

    "esa persona",

    "el problema",

    "lo mismo",

    "ahi",

    "alli",

    "despues",

    "en ese caso",

    "puedo",

    "que hago",

    "como hago",

    "se puede",

    "y si tambien"

  ];


  return contextualWords.some(word => t.includes(word));

}


/* =========================================================
   SALUDO
========================================================= */

function isGreeting(text) {

  const t = normalize(text);


  return [

    "hola",

    "holaa",

    "holaaa",

    "buenas",

    "buenos dias",

    "buenas tardes",

    "buenas noches",

    "hey",

    "hello"

  ].includes(t);

}


/* =========================================================
   AGRADECIMIENTO
========================================================= */

function isThanks(text) {

  const t = normalize(text);


  return [

    "gracias",

    "muchas gracias",

    "graciass",

    "gracias bot",

    "thank you"

  ].includes(t);

}


/* =========================================================
   RESPUESTA PRINCIPAL
========================================================= */

function answer(question) {

  const original = question.trim();


  if (!original) return;


  const normalized = normalize(original);


  /* SALUDO */

  if (isGreeting(original)) {

    addMessage(

      "¡Hola! 💙 Soy <b>LawsBot Perú</b>.<br><br>" +

      "Puedo orientarte sobre derechos digitales, seguridad, privacidad, " +

      "hackeo de cuentas, acoso, suplantación, imágenes íntimas y denuncias.<br><br>" +

      "Cuéntame qué ocurrió y podemos hablar del tema paso a paso."

    );

    return;

  }


  /* AGRADECIMIENTO */

  if (isThanks(original)) {

    addMessage(

      "¡De nada! 💙 Si quieres seguir con el mismo problema, puedes preguntarme directamente sin volver a explicar todo."

    );

    return;

  }


  conversation.turn++;


  /* PLATAFORMA */

  const platform = detectPlatform(original);


  if (platform) {

    conversation.platform = platform;

  }


  /* DETALLES */

  updateDetails(original);


  /* TEMA DETECTADO */

  const detectedTopic = detectTopic(original);


  let topic;


  /*
    Si la pregunta depende del contexto,
    conservamos el tema anterior.
  */

  if (

    conversation.currentTopic &&

    isContextualQuestion(original) &&

    !isClearTopicChange(original)

  ) {

    topic = conversation.currentTopic;

  }

  else if (detectedTopic) {

    topic = detectedTopic;

  }

  else if (conversation.currentTopic) {

    topic = conversation.currentTopic;

  }

  else {

    topic = null;

  }


  /* CAMBIO EXPLÍCITO */

  if (isClearTopicChange(original)) {

    topic = detectedTopic || null;

  }


  /* GUARDAR TEMA */

  if (topic) {

    conversation.currentTopic = topic;

  }


  /* HISTORIAL */

  conversation.history.push({

    user: original,

    topic: conversation.currentTopic,

    platform: conversation.platform,

    turn: conversation.turn

  });


  /* MENSAJE DEL USUARIO */

  addMessage(original, "user");


  showTyping();


  setTimeout(() => {

    hideTyping();


    let response;


    if (conversation.currentTopic) {

      response = responseForTopic(

        conversation.currentTopic,

        original

      );

    }

    else {

      response =

        "No quiero darte una respuesta equivocada porque todavía no identifico el tema.<br><br>" +

        "Puedes contarme, por ejemplo:<br><br>" +

        "• Me hackearon Instagram<br>" +

        "• ¿Qué hago si cambiaron mi correo?<br>" +

        "• ¿Qué son los Derechos ARCO?<br>" +

        "• Alguien publicó una foto íntima<br>" +

        "• ¿Cómo puedo denunciar?";

    }


    addMessage(response);


    updateContext();


  }, 450);

}


/* =========================================================

========================================================= */

function sendMessage() {

  const text = input.value.trim();


  if (!text) return;


  input.value = "";


  answer(text);

}


send.addEventListener("click", sendMessage);


input.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {

});
