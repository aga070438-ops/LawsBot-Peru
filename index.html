<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LawsBot Perú 💙</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #dff3ff, #eef8ff);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .chat-container {
      width: 100%;
      max-width: 850px;
      height: 90vh;
      max-height: 850px;
      background: white;
      border-radius: 25px;
      box-shadow: 0 10px 40px rgba(0, 70, 120, 0.18);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #0877c9, #005ca8);
      color: white;
      padding: 22px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 7px 0 0;
      font-size: 14px;
      opacity: 0.95;
    }

    .chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #f7fbff;
    }

    .message {
      display: flex;
      margin-bottom: 15px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 78%;
      padding: 13px 16px;
      border-radius: 18px;
      line-height: 1.5;
      font-size: 15px;
      word-wrap: break-word;
    }

    .bot .bubble {
      background: white;
      color: #183247;
      border: 1px solid #dcecf7;
      border-bottom-left-radius: 5px;
    }

    .user .bubble {
      background: #0877c9;
      color: white;
      border-bottom-right-radius: 5px;
    }

    .bubble b {
      color: #075d99;
    }

    .user .bubble b {
      color: white;
    }

    .bubble a {
      color: #0877c9;
      font-weight: bold;
      text-decoration: none;
    }

    .bubble a:hover {
      text-decoration: underline;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .chip {
      border: 1px solid #8cccf4;
      background: #eef8ff;
      color: #075d99;
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      transition: 0.2s;
    }

    .chip:hover {
      background: #d9efff;
      transform: translateY(-1px);
    }

    .input-area {
      padding: 15px;
      background: white;
      border-top: 1px solid #e0edf5;
    }

    .input-box {
      display: flex;
      gap: 10px;
    }

    #userInput {
      flex: 1;
      border: 1px solid #c9ddea;
      border-radius: 22px;
      padding: 13px 17px;
      font-size: 15px;
      outline: none;
    }

    #userInput:focus {
      border-color: #0877c9;
      box-shadow: 0 0 0 3px rgba(8, 119, 201, 0.1);
    }

    #sendBtn {
      border: none;
      background: #0877c9;
      color: white;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 19px;
      transition: 0.2s;
    }

    #sendBtn:hover {
      background: #005ca8;
      transform: scale(1.04);
    }

    .typing {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      background: #7baac8;
      border-radius: 50%;
      animation: blink 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {
      0%, 80%, 100% {
        opacity: 0.3;
      }
      40% {
        opacity: 1;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 0;
      }

      .chat-container {
        height: 100vh;
        max-height: none;
        border-radius: 0;
      }

      .bubble {
        max-width: 88%;
      }

      .header h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

<div class="chat-container">

  <div class="header">
    <h1>💙 LawsBot Perú</h1>
    <p>Derechos digitales · Ciberseguridad · Convivencia digital</p>
  </div>

  <div id="chat" class="chat"></div>

  <div class="input-area">
    <div class="input-box">
      <input
        id="userInput"
        type="text"
        placeholder="Escribe tu pregunta..."
        autocomplete="off"
      >
      <button id="sendBtn">➤</button>
    </div>
  </div>

</div>

<script>

  /* =========================================================
     FUENTES OFICIALES
  ========================================================= */

  const SOURCES = {
    arco: {
      url: "https://www.gob.pe/9270-que-son-los-derechos-arco",
      name: "ANPD – Derechos ARCO"
    },

    ley29733: {
      url: "https://www.gob.pe/institucion/anpd/normas-legales",
      name: "ANPD – Normas legales"
    },

    delitos: {
      url: "https://www.gob.pe/institucion/congreso-de-la-republica/normas-legales/239569-30096",
      name: "Congreso – Ley 30096"
    },

    dl1625: {
      url: "https://www.gob.pe/institucion/mimp/informes-publicaciones/6499867-decreto-legislativo-n-1625-ley-que-fortalece-las-normas-sobre-el-uso-de-tid-relacionado-a-la-difusion-de-imagenes-materiales-audiovisuales-o-audios-con-contenido-sexual",
      name: "MIMP – Decreto Legislativo 1625"
    },

    denuncias: {
      url: "https://denuncia.mininter.gob.pe/preguntas",
      name: "MININTER – Central Única de Denuncias"
    },

    mp: {
      url: "https://portal.mpfn.gob.pe/denuncias-en-linea",
      name: "Ministerio Público – Denuncias en línea"
    }
  };


  /* =========================================================
     ESTADO DE LA CONVERSACIÓN
  ========================================================= */

  let conversation = {
    currentTopic: null,
    platform: null,

    details: {
      accountHacked: false,
      emailChanged: false,
      passwordChanged: false,
      twoFactor: false,
      recoveryAttempted: false,
      intimateImages: false,
      threatened: false,
      impersonation: false,
      harassment: false,
      phishing: false,
      dataProblem: false
    },

    history: [],
    turn: 0
  };


  /* =========================================================
     ELEMENTOS
  ========================================================= */

  const chat = document.getElementById("chat");
  const input = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");


  /* =========================================================
     ESCAPAR TEXTO DEL USUARIO
     Esto evita que el usuario pueda insertar HTML.
  ========================================================= */

  function escapeHTML(text) {
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* =========================================================
     CONVERTIR LINKS
  ========================================================= */

  function link(url, text) {
    return `<a href="${url}" target="_blank" rel="noopener noreferrer">${text}</a>`;
  }


  /* =========================================================
     AGREGAR MENSAJE
  ========================================================= */

  function addMessage(text, sender = "bot") {

    const message = document.createElement("div");
    message.className = `message ${sender}`;

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    /*
      IMPORTANTE:

      Las respuestas del BOT pueden contener:
      <b>
      <br>
      <a>

      Por eso usamos innerHTML para el bot.

      En cambio, los mensajes del USUARIO
      se muestran con textContent para evitar
      que puedan ejecutar HTML.
    */

    if (sender === "bot") {
      bubble.innerHTML = text;
    } else {
      bubble.textContent = text;
    }

    message.appendChild(bubble);
    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
  }


  /* =========================================================
     BOTONES DE OPCIONES
  ========================================================= */

  function chips(options) {

    const container = document.createElement("div");
    container.className = "chips";

    options.forEach(option => {

      const button = document.createElement("button");

      button.className = "chip";
      button.textContent = option;

      button.addEventListener("click", () => {
        input.value = option;
        ask();
      });

      container.appendChild(button);
    });

    chat.appendChild(container);

    chat.scrollTop = chat.scrollHeight;
  }


  /* =========================================================
     NORMALIZAR TEXTO
  ========================================================= */

  function normalize(text) {

    return text
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .trim();
  }


  /* =========================================================
     DETECTAR PLATAFORMA
  ========================================================= */

  function detectPlatform(q) {

    if (/instagram|ig/.test(q)) return "Instagram";

    if (/facebook|fb/.test(q)) return "Facebook";

    if (/tiktok/.test(q)) return "TikTok";

    if (/whatsapp|wsp/.test(q)) return "WhatsApp";

    if (/snapchat/.test(q)) return "Snapchat";

    if (/discord/.test(q)) return "Discord";

    if (/\bx\b|twitter/.test(q)) return "X";

    return null;
  }


  /* =========================================================
     DETECTAR TEMA
  ========================================================= */

  function detectTopic(q) {

    const scores = {

      hackeo: 0,
      imagenIntima: 0,
      suplantacion: 0,
      extorsion: 0,
      acoso: 0,
      phishing: 0,
      datos: 0,
      arco: 0,
      denuncia: 0,
      seguridad: 0,
      convivencia: 0,
      derechos: 0
    };


    /* HACKING */

    if (/hackear|hackearon|hackeado|hackeo|robaron mi cuenta|entraron a mi cuenta|me quitaron la cuenta/.test(q)) {
      scores.hackeo += 5;
    }

    if (/contraseña|contrasena|password/.test(q)) {
      scores.hackeo += 2;
    }

    if (/correo cambiado|email cambiado|cambiaron mi correo/.test(q)) {
      scores.hackeo += 4;
    }


    /* IMÁGENES ÍNTIMAS */

    if (/foto intima|imagen intima|video intimo|contenido intimo|nudes|desnudo|pack/.test(q)) {
      scores.imagenIntima += 6;
    }

    if (/foto.*sexual|imagen.*sexual|video.*sexual/.test(q)) {
      scores.imagenIntima += 5;
    }

    if (/difundir|publicar|compartir/.test(q) && /foto|imagen|video/.test(q)) {
      scores.imagenIntima += 4;
    }


    /* SUPLANTACIÓN */

    if (/suplant|cuenta falsa|perfil falso|se hacen pasar por mi|se hace pasar por mi/.test(q)) {
      scores.suplantacion += 6;
    }

    if (/robaron mi identidad|usan mi nombre|usan mis fotos/.test(q)) {
      scores.suplantacion += 5;
    }


    /* EXTORSIÓN */

    if (/extors|chantaj|amenaz.*publicar|me pide dinero|pide dinero.*foto/.test(q)) {
      scores.extorsion += 6;
    }


    /* ACOSO */

    if (/acoso|acosan|bullying|bully|hostig|insult|amenaz|molest|odio|troll/.test(q)) {
      scores.acoso += 5;
    }


    /* PHISHING / ESTAFAS */

    if (/phishing|estafa|estafaron|enlace falso|link falso|mensaje falso|robaron mis datos/.test(q)) {
      scores.phishing += 6;
    }


    /* DATOS PERSONALES */

    if (/datos personales|informacion personal|información personal|mis datos/.test(q)) {
      scores.datos += 5;
    }


    /* DERECHOS ARCO */

    if (/derechos arco|derecho de acceso|derecho de rectificacion|derecho de cancelacion|derecho de oposicion/.test(q)) {
      scores.arco += 7;
    }


    /* DENUNCIAS */

    if (/denunciar|denuncia|policia|pnp|fiscalia|fiscalía|autoridad/.test(q)) {
      scores.denuncia += 5;
    }


    /* SEGURIDAD */

    if (/seguridad|proteger mi cuenta|proteger cuenta|2fa|doble factor|verificacion en dos pasos/.test(q)) {
      scores.seguridad += 4;
    }


    /* CONVIVENCIA */

    if (/netiqueta|huella digital|fake news|noticias falsas|desinformacion|desinformación|convivencia|publicar en internet/.test(q)) {
      scores.convivencia += 5;
    }


    /* DERECHOS */

    if (/derechos digitales|derecho|legal|ley|prohibido|puedo hacer/.test(q)) {
      scores.derechos += 2;
    }


    let bestTopic = null;
    let bestScore = 0;

    for (const topic in scores) {

      if (scores[topic] > bestScore) {
        bestScore = scores[topic];
        bestTopic = topic;
      }
    }

    return bestScore >= 2 ? bestTopic : null;
  }


  /* =========================================================
     ACTUALIZAR DETALLES
  ========================================================= */

  function updateDetails(q) {

    if (/hackear|hackearon|hackeado|hackeo|robaron mi cuenta|entraron a mi cuenta/.test(q)) {
      conversation.details.accountHacked = true;
    }

    if (/correo cambiado|email cambiado|cambiaron mi correo/.test(q)) {
      conversation.details.emailChanged = true;
    }

    if (/contraseña cambiada|cambiaron mi contraseña|password cambiado/.test(q)) {
      conversation.details.passwordChanged = true;
    }

    if (/2fa|doble factor|verificacion en dos pasos|verificación en dos pasos/.test(q)) {
      conversation.details.twoFactor = true;
    }

    if (/no puedo recuperar|no puedo entrar|sin acceso|perdi el acceso|perdí el acceso/.test(q)) {
      conversation.details.recoveryAttempted = true;
    }

    if (/foto intima|imagen intima|video intimo|nudes|desnudo|pack/.test(q)) {
      conversation.details.intimateImages = true;
    }

    if (/amenaz|chantaj|extors/.test(q)) {
      conversation.details.threatened = true;
    }

    if (/suplant|cuenta falsa|perfil falso|se hacen pasar por mi/.test(q)) {
      conversation.details.impersonation = true;
    }

    if (/acoso|acosan|bullying|bully|hostig/.test(q)) {
      conversation.details.harassment = true;
    }

    if (/phishing|estafa|enlace falso|link falso/.test(q)) {
      conversation.details.phishing = true;
    }

    if (/datos personales|informacion personal|información personal/.test(q)) {
      conversation.details.dataProblem = true;
    }
  }


  /* =========================================================
     ¿ES UNA PREGUNTA DE CONTEXTO?
  ========================================================= */

  function isContextualQuestion(q) {

    return (
      /^(y|e|tambien|también|entonces|pero|ademas|además|si|sí)\b/.test(q) ||
      /^(y si|pero si|entonces si|entonces qué|entonces que)/.test(q) ||
      /esa cuenta|esa persona|el problema|lo mismo|en ese caso|tambien puedo|también puedo/.test(q)
    );
  }


  /* =========================================================
     RESPUESTAS
  ========================================================= */

  function responseFor(topic, q) {

    /* ---------------------------------------------------------
       HACKING
    --------------------------------------------------------- */

    if (topic === "hackeo") {

      if (conversation.details.emailChanged) {

        return `
          <b>Si también cambiaron el correo de tu cuenta:</b><br><br>

          Eso puede dificultar la recuperación, pero todavía puedes intentar
          recuperar la cuenta mediante las opciones oficiales de la plataforma.
          <br><br>

          <b>Haz esto:</b><br>
          1. No compartas códigos de recuperación con nadie.<br>
          2. Usa únicamente la página o aplicación oficial de la plataforma.<br>
          3. Revisa si recibiste algún correo avisando del cambio de email.<br>
          4. Cambia las contraseñas de otras cuentas que utilicen la misma contraseña.<br>
          5. Activa la autenticación de dos factores cuando recuperes el acceso.
        `;
      }


      if (conversation.details.twoFactor) {

        return `
          <b>Si activaron el 2FA:</b><br><br>

          La cuenta puede seguir siendo recuperable, aunque el atacante haya
          activado la verificación en dos pasos.

          <br><br>

          Busca en la plataforma la opción de
          <b>"¿No puedes acceder?"</b>,
          <b>"Recuperar cuenta"</b> o
          <b>"Mi cuenta fue hackeada"</b>.

          <br><br>

          No entregues códigos, contraseñas ni enlaces de recuperación a
          personas que prometan devolverte la cuenta.
        `;
      }


      return `
        <b>Si te hackearon una cuenta:</b><br><br>

        1. Intenta recuperar el acceso desde la plataforma oficial.<br>
        2. Cambia la contraseña si todavía puedes entrar.<br>
        3. Cierra sesiones que no reconozcas.<br>
        4. Activa la autenticación de dos factores.<br>
        5. Revisa si cambiaron tu correo o teléfono de recuperación.<br>
        6. No compartas códigos de seguridad con nadie.<br><br>

        Si hubo fraude, amenazas, extorsión o acceso ilícito,
        también puedes evaluar presentar una denuncia ante las autoridades.
      `;
    }


    /* ---------------------------------------------------------
       IMÁGENES ÍNTIMAS
    --------------------------------------------------------- */

    if (topic === "imagenIntima") {

      if (conversation.details.threatened || conversation.details.extortion) {

        return `
          <b>Si te están amenazando con publicar una imagen íntima:</b><br><br>

          No pagues ni envíes más contenido. Guarda las pruebas de las
          amenazas, como capturas de pantalla, nombres de usuario, enlaces
          y fechas.

          <br><br>

          Evita borrar las conversaciones antes de guardar las evidencias.

          <br><br>

          En Perú existen normas que protegen frente a la difusión no
          consentida de contenido íntimo.

          <br><br>

          ${link(SOURCES.dl1625.url, SOURCES.dl1625.name)}
        `;
      }


      return `
        <b>Sobre la difusión de imágenes íntimas:</b><br><br>

        Compartir o difundir contenido íntimo de una persona sin su
        consentimiento puede tener consecuencias legales.

        <br><br>

        Si eres víctima:<br>
        • Guarda las pruebas.<br>
        • No pagues a quien te amenaza.<br>
        • No reenvíes el contenido.<br>
        • Reporta la publicación en la plataforma.<br>
        • Busca ayuda de una persona adulta de confianza y considera
        acudir a las autoridades.

        <br><br>

        Puedes consultar información oficial sobre el
        <b>Decreto Legislativo N.º 1625</b> aquí:<br>
        ${link(SOURCES.dl1625.url, SOURCES.dl1625.name)}
      `;
    }


    /* ---------------------------------------------------------
       SUPLANTACIÓN
    --------------------------------------------------------- */

    if (topic === "suplantacion") {

      return `
        <b>Si alguien se está haciendo pasar por ti:</b><br><br>

        1. Guarda capturas del perfil falso.<br>
        2. Copia el enlace del perfil o publicación.<br>
        3. Reporta la cuenta por suplantación de identidad.<br>
        4. Informa a tus contactos para evitar que sean engañados.<br>
        5. Si existe fraude, amenazas o perjuicio, conserva las pruebas
        y considera denunciar.
        
        <br><br>

        También revisa la seguridad de tus propias cuentas y activa
        la autenticación de dos factores.
      `;
    }


    /* ---------------------------------------------------------
       EXTORSIÓN
    --------------------------------------------------------- */

    if (topic === "extorsion") {

      return `
        <b>Si te están extorsionando o chantajeando:</b><br><br>

        No pagues ni envíes más información o contenido.

        <br><br>

        Guarda como evidencia:<br>
        • Capturas de pantalla.<br>
        • Mensajes y audios.<br>
        • Nombre de usuario.<br>
        • Número de teléfono, si existe.<br>
        • Enlaces a perfiles o publicaciones.<br>
        • Fechas y horas.

        <br><br>

        Si existe una amenaza o un delito, puedes acudir a las autoridades
        y presentar una denuncia.
      `;
    }


    /* ---------------------------------------------------------
       ACOSO
    --------------------------------------------------------- */

    if (topic === "acoso") {

      return `
        <b>Si estás sufriendo acoso en internet:</b><br><br>

        No tienes que responder ni soportar los mensajes.

        <br><br>

        Puedes:<br>
        • Bloquear a la persona.<br>
        • Reportar la cuenta.<br>
        • Guardar evidencias.<br>
        • Ajustar la privacidad de tus cuentas.<br>
        • Contárselo a una persona adulta de confianza si eres menor de edad.

        <br><br>

        Si existen amenazas, extorsión o una situación que pueda constituir
        un delito, conserva las pruebas y considera acudir a las autoridades.
      `;
    }


    /* ---------------------------------------------------------
       PHISHING
    --------------------------------------------------------- */

    if (topic === "phishing") {

      return `
        <b>Si recibiste un enlace sospechoso:</b><br><br>

        No ingreses tu contraseña ni códigos de seguridad.

        <br><br>

        Si ya ingresaste tus datos:<br>
        1. Cambia inmediatamente la contraseña desde la página oficial.<br>
        2. Cierra sesiones desconocidas.<br>
        3. Activa la autenticación de dos factores.<br>
        4. Revisa tu correo y número de recuperación.<br>
        5. Si utilizaste esa contraseña en otras cuentas, cámbiala también allí.
      `;
    }


    /* ---------------------------------------------------------
       ARCO
    --------------------------------------------------------- */

    if (topic === "arco") {

      return `
        <b>Los derechos ARCO</b> son derechos relacionados con tus datos
        personales.

        <br><br>

        Incluyen:<br>
        <b>Acceso:</b> saber qué datos personales tienen sobre ti.<br>
        <b>Rectificación:</b> solicitar que corrijan datos incorrectos.<br>
        <b>Cancelación:</b> pedir la eliminación cuando corresponda.<br>
        <b>Oposición:</b> oponerte al tratamiento de tus datos en determinados casos.

        <br><br>

        Información oficial de la Autoridad Nacional de Protección de Datos
        Personales:<br>

        ${link(SOURCES.arco.url, SOURCES.arco.name)}
      `;
    }


    /* ---------------------------------------------------------
       DATOS
    --------------------------------------------------------- */

    if (topic === "datos") {

      return `
        <b>Sobre tus datos personales:</b><br><br>

        Las organizaciones que tratan datos personales deben hacerlo de
        acuerdo con las normas aplicables de protección de datos.

        <br><br>

        Si quieres conocer, corregir, cancelar u oponerte al tratamiento
        de determinados datos, puedes revisar tus derechos ARCO.

        <br><br>

        ${link(SOURCES.arco.url, SOURCES.arco.name)}
      `;
    }


    /* ---------------------------------------------------------
       DENUNCIAS
    --------------------------------------------------------- */

    if (topic === "denuncia") {

      return `
        <b>Si quieres denunciar una situación ocurrida en internet:</b><br><br>

        Primero conserva todas las evidencias disponibles.

        <br><br>

        Dependiendo del caso, puedes acudir a las autoridades competentes.

        <br><br>

        <b>Ministerio del Interior – Central Única de Denuncias:</b><br>
        ${link(SOURCES.denuncias.url, SOURCES.denuncias.name)}

        <br><br>

        <b>Ministerio Público – Denuncias en línea:</b><br>
        ${link(SOURCES.mp.url, SOURCES.mp.name)}

        <br><br>

        Si existe peligro inmediato, busca ayuda de emergencia y de una
        persona adulta de confianza.
      `;
    }


    /* ---------------------------------------------------------
       SEGURIDAD
    --------------------------------------------------------- */

    if (topic === "seguridad") {

      return `
        <b>Para mejorar la seguridad de tus cuentas:</b><br><br>

        • Usa contraseñas diferentes para cada cuenta.<br>
        • Activa la autenticación de dos factores.<br>
        • No compartas códigos de verificación.<br>
        • Evita iniciar sesión desde enlaces sospechosos.<br>
        • Mantén actualizado tu celular y tus aplicaciones.<br>
        • Revisa periódicamente las sesiones activas.
      `;
    }


    /* ---------------------------------------------------------
       CONVIVENCIA
    --------------------------------------------------------- */

    if (topic === "convivencia") {

      return `
        <b>Para mantener una buena convivencia digital:</b><br><br>

        • Respeta a otras personas.<br>
        • No compartas información privada sin permiso.<br>
        • Verifica la información antes de compartirla.<br>
        • Evita participar en acoso o humillaciones.<br>
        • Piensa antes de publicar algo que pueda afectar a otra persona.<br>
        • Protege tus datos personales.
      `;
    }


    /* ---------------------------------------------------------
       DERECHOS GENERALES
    --------------------------------------------------------- */

    if (topic === "derechos") {

      return `
        <b>Los derechos digitales</b> están relacionados con la protección
        de las personas en el entorno digital.

        <br><br>

        Entre los temas que puedes consultar están:<br>
        • Privacidad y datos personales.<br>
        • Seguridad digital.<br>
        • Suplantación de identidad.<br>
        • Acoso en internet.<br>
        • Difusión de contenido íntimo.<br>
        • Denuncias y canales de ayuda.
      `;
    }


    /* ---------------------------------------------------------
       RESPUESTA GENERAL
    --------------------------------------------------------- */

    return `
      Claro 💙. Cuéntame un poco más sobre lo que ocurrió y te orientarè
      según el tema.

      <br><br>

      Puedes preguntarme, por ejemplo:<br>

      • <b>“Me hackearon Instagram”</b><br>
      • <b>“¿Y si cambiaron mi correo?”</b><br>
      • <b>“¿Puedo denunciar?”</b><br>
      • <b>“¿Qué hago si publicaron una foto íntima?”</b><br>
      • <b>“¿Qué son los derechos ARCO?”</b>
    `;
  }


  /* =========================================================
     RESPUESTA PRINCIPAL
  ========================================================= */

  function answer(userText) {

    const q = normalize(userText);

    if (!q) return;


    /* Guardar mensaje */

    conversation.history.push({
      role: "user",
      text: userText
    });


    conversation.turn++;


    /* Detectar plataforma */

    const platform = detectPlatform(q);

    if (platform) {
      conversation.platform = platform;
    }


    /* Actualizar detalles */

    updateDetails(q);


    /* Detectar nuevo tema */

    let detectedTopic = detectTopic(q);


    /*
      Si la pregunta parece continuar la conversación,
      mantenemos el tema anterior.
    */

    if (isContextualQuestion(q) && conversation.currentTopic) {

      detectedTopic = conversation.currentTopic;
    }


    /*
      Si encontramos un tema nuevo,
      actualizamos el contexto.
    */

    if (detectedTopic) {

      conversation.currentTopic = detectedTopic;
    }


    /* =====================================================
       SALUDOS
    ===================================================== */

    if (/^(hola|holaa|holaaa|buenas|hey|hi|ola)\b/.test(q)) {

      return `
        ¡Hola! 💙 Soy <b>LawsBot Perú</b>.

        <br><br>

        Estoy aquí para orientarte sobre derechos digitales,
        privacidad, seguridad y convivencia en internet.

        <br><br>

        Puedes contarme una situación completa y después seguir
        preguntándome sobre ella sin repetir todo el contexto.

        <br><br>

        Por ejemplo:<br>
        <b>“Me hackearon Instagram”</b><br>
        y después:<br>
        <b>“¿Y si cambiaron mi correo?”</b>
      `;
    }


    /* =====================================================
       AGRADECIMIENTO
    ===================================================== */

    if (/^(gracias|muchas gracias|thank you|ty)\b/.test(q)) {

      return `
        ¡De nada! 💙

        Si necesitas seguir preguntando sobre la misma situación,
        puedes hacerlo. Intentaré mantener el contexto de nuestra
        conversación.
      `;
    }


    /* =====================================================
       RESPUESTA
    ===================================================== */

    return responseFor(conversation.currentTopic, q);
  }


  /* =========================================================
     ENVIAR MENSAJE
  ========================================================= */

  function ask() {

    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");

    input.value = "";

    /*
      Pequeña animación de escritura
    */

    const typingMessage = document.createElement("div");

    typingMessage.className = "message bot";

    typingMessage.innerHTML = `
      <div class="bubble">
        <div class="typing">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    `;

    chat.appendChild(typingMessage);

    chat.scrollTop = chat.scrollHeight;


    setTimeout(() => {

      typingMessage.remove();

      const response = answer(text);

      addMessage(response, "bot");

    }, 450);
  }


  /* =========================================================
     EVENTOS
  ========================================================= */

  sendBtn.addEventListener("click", ask);

  input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      ask();
    }

  });


  /* =========================================================
     MENSAJE INICIAL
  ========================================================= */

  addMessage(`
    ¡Hola! 💙 Soy <b>LawsBot Perú</b>.

    <br><br>

    Estoy aquí para orientarte sobre tus derechos y seguridad
    en internet.

    <br><br>

    Puedes contarme una situación completa y continuar preguntándome
    sin repetir el contexto.

    <br><br>

    Por ejemplo, puedes decirme:
    <b>“Me hackearon Instagram”</b>
    y después preguntarme:
    <b>“¿Y si cambiaron mi correo?”</b>.

    <br><br>

    ¿Sobre qué necesitas orientación?
  `);

</script>
