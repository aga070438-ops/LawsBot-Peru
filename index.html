/* =========================================================
   NORMALIZACIÓN
========================================================= */

function normalizeText(text) {
  return text
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[¿?¡!.,;:()[\]{}"']/g, " ")
    .replace(/[-/]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}


/* =========================================================
   FUNCIONES AUXILIARES
========================================================= */

function hasAny(text, words) {
  return words.some(word => text.includes(normalizeText(word)));
}

function hasAll(text, words) {
  return words.every(word => text.includes(normalizeText(word)));
}

En Perú, este tema también se relaciona con la inclusión digital y la reducción de la brecha digital.
`,

  libertadExpresion: `
Sí. La libertad de expresión también se aplica al entorno digital y permite a las personas expresar opiniones, ideas e información mediante redes sociales y otros medios de Internet.

Sin embargo, este derecho no es absoluto. Su ejercicio debe respetar otros derechos y las restricciones que establezca la ley.

Por ejemplo, pueden existir responsabilidades frente a amenazas, acoso u otras conductas ilícitas.

Por eso, tener libertad de expresión en redes no significa que cualquier contenido esté permitido sin consecuencias.
`,

  censuraDigital: `
La **censura digital** consiste en restringir, bloquear, eliminar o impedir el acceso a determinados contenidos, expresiones, sitios web o información en Internet.

Puede involucrar a gobiernos, plataformas u otros actores, dependiendo del caso.

No toda eliminación de contenido constituye necesariamente censura. Por ejemplo, una plataforma puede retirar contenido porque infringe sus reglas.

Para analizar una posible afectación a la libertad de expresión, es importante considerar quién realizó la restricción, qué contenido fue afectado y cuál fue la justificación.
`,

  cifradoExtremo: `
El **cifrado de extremo a extremo** protege una comunicación haciendo que el contenido sea legible únicamente para los participantes autorizados de la conversación.

Esto ayuda a proteger la privacidad de conversaciones, fotografías, archivos y otra información frente a determinados accesos no autorizados durante su transmisión.

⚠️ El cifrado no significa que una cuenta sea completamente segura. También es importante utilizar contraseñas fuertes, autenticación de dos factores y mantener los dispositivos actualizados.

/* =========================================================
   DETECCIÓN DE TEMAS
========================================================= */

function detectTopic(q) {

  const topics = [];

  function add(topic, score) {
    topics.push({ topic, score });
  }


  /* SALUDOS */

  if (
    hasAny(q, [
      "hola",
      "holaa",
      "holaaa",
      "buenas",
      "buenos dias",
      "buenas tardes",
      "buenas noches"
    ])
  ) {
    add("saludo", 20);
  }


  /* AYUDA */

  if (
    hasAny(q, [
      "ayuda",
      "que puedes hacer",
      "que sabes hacer",
      "como puedes ayudar"
    ])
  ) {
    add("ayuda", 20);
  }


  /* HUELLA DIGITAL */

  if (
    hasAny(q, [
      "huella digital",
      "rastro digital",
      "que es la huella"
    ])
  ) {
    add("huellaDigital", 20);
  }


  /* DERECHO AL OLVIDO */

  if (
    hasAny(q, [
      "derecho al olvido",
      "borrar informacion de internet",
      "eliminar informacion de internet",
      "quitar informacion de internet"
    ])
  ) {
    add("derechoOlvido", 20);
  }

  if (
    hasAny(q, [

      "normas de internet",
      "comportamiento en internet",
      "comportarse en internet"
    ])
  ) {
    add("netiqueta", 20);
  }


  /* DOXING */

  if (
    hasAny(q, [
      "doxing",

      "publicaron mi direccion",
      "publicaron mis datos",
      "exponer mis datos"
    ])
  ) {
    add("doxing", 20);
  }


  /* DERECHOS DE AUTOR */

      "copiar contenido"
    ])

    add("derechoAutor", 20);
  }


  /* NEUTRALIDAD DE LA RED */

  if (
    hasAny(q, [
      "neutralidad de la red",

    ])
  ) {
    add("neutralidadRed", 20);
  }


  /* CONSENTIMIENTO PARA IMÁGENES */

  if (
    hasAny(q, [
      "publicar una foto de alguien",
      "publicar foto de otra persona",
      "foto sin permiso",
      "imagen sin permiso"
    ])
  ) {
    add("consentimientoImagenes", 20);
  }


  /* BRECHA DIGITAL */

  if (
    hasAny(q, [
      "brecha digital",
      "desigualdad digital",
      "desigualdad en internet"
    ])
  ) {
    add("brechaDigital", 20);
  }


  /* DERECHOS ARCO */

  if (
    hasAny(q, [
      "derechos arco",
      "derecho arco",
      "acceso rectificacion cancelacion oposicion",
      "acceso rectificación cancelación oposición"
    ])
  ) {
    add("arco", 20);
  }


  /* PHISHING */

  if (
    hasAny(q, [
      "phishing",
      "correo falso",
      "mensaje falso",
      "enlace sospechoso",
      "link sospechoso"
    ])
  ) {
    add("phishing", 20);
  }


  /* PRIVACIDAD */

  if (
    hasAny(q, [
      "privacidad",
      "privacidad digital",
      "proteger mi privacidad"
    ])
  ) {
    add("privacidad", 10);
  }


  /* DATOS PERSONALES */

  if (
    hasAny(q, [
      "datos personales",
      "dato personal"
    ]) &&
    !hasAny(q, [
      "datos sensibles",
      "dato sensible"
    ])
  ) {
    add("datosPersonales", 14);
  }


  /* DATOS SENSIBLES */

  if (
    hasAny(q, [
      "datos sensibles",

    add("datosSensibles", 20);

  if (

  /* SEXTORSIÓN */

    hasAny(q, [

  /* CHATS PRIVADOS */

  if (
    hasAny(q, [
      "chat privado",

      "conversacion privada",
      "conversación privada",
      "publicar conversaciones"
    ])
  ) {
    add("chatsPrivados", 20);
  }


  /* RESUBIR CONTENIDO */

  if (
    hasAny(q, [
      "resubir contenido",
      "volver a publicar",
      "republicar una foto",
      "republicar contenido"
    ])
  ) {
    add("resubirContenido", 20);

  /* CONTROL PARENTAL */

  if (
    hasAny(q, [
      "control parental",
      "controles parentales",
      "controlar lo que ve mi hijo"
    ])
  ) {
    add("controlParental", 20);
  }


  /* GROOMING */

  if (
    hasAny(q, [
      "grooming",
      "adulto habla con un menor",
      "adulto contacta a un menor"
    ])
  ) {
    add("grooming", 20);
  }


  /* DERECHO A LA IMAGEN */

  if (
    hasAny(q, [
      "derecho a la imagen",
      "propia imagen",
      "derecho sobre mi imagen"
    ])
  ) {
    add("derechoImagen", 20);
  }


  /* TESTIGO DE ACOSO */

  if (
    hasAny(q, [
      "soy testigo",
      "vi un caso de acoso",
      "estoy viendo acoso",
      "amigo sufre acoso"
    ])
  ) {
    add("testigoAcoso", 20);
  }


  /* IDENTIDAD DIGITAL */

  if (
    hasAny(q, [
      "identidad digital",

    ])
  ) {
    add("identidadDigital", 20);
  }


  /* CONVIVENCIA DIGITAL */

  if (
    hasAny(q, [
      "convivencia digital",

    ])
  ) {
    add("convivencia", 20);
  }


  /* CONTRASEÑAS */

  if (

      "contraseña segura",

      "contrasenas seguras",

    ])
  ) {
    add("contrasenas", 20);
  }


  /* INSTAGRAM HACKEADO */

  if (
    hasAny(q, [
      "hackearon mi instagram",
      "hackearon mi cuenta",
      "me hackearon instagram",
      "instagram hackeado"
    ])
  ) {
    add("instagramHackeado", 25);
  }


  /* INSTAGRAM + CORREO */

  if (
    hasAny(q, [
      "cambiaron mi correo",
      "cambiaron el correo",
      "cambiaron mi email",
      "cambiaron el email"
    ]) &&
    hasAny(q, [
      "instagram",
      "cuenta"
    ])
  ) {
    add("instagramCorreo", 25);
  }


  /* CONSENTIMIENTO */

  if (
    hasAny(q, [
      "consentimiento",
      "sin mi permiso",
      "permiso para publicar"
    ])
  ) {
    add("consentimiento", 15);
  }


  /* ACCESO DIGITAL */

  if (
    hasAny(q, [
      "acceso digital",
      "acceso a tecnologia",
      "acceso a tecnología",
      "acceso a internet"
    ])
  ) {
    add("accesoDigital", 8);
  }


  /* ELIMINACIÓN DE IMÁGENES DE MENORES */

  if (
    hasAny(q, [
      "foto de mi hijo",
      "fotos de mi hijo",
      "foto de mi hija",
      "fotos de mi hija",
      "menor de edad"
    ]) &&
    hasAny(q, [
      "eliminar",

  /* =========================================================
     NUEVOS TEMAS QUE ESTABAN FALLANDO

  if (

  /* ORDENAR POR PUNTAJE */

  topics.sort((a, b) => b.score - a.score);

/* =========================================================
   RESPUESTAS SEGÚN CONTEXTO
========================================================= */

function contextualResponse(q) {

  /* INSTAGRAM */

  if (
    lastTopic === "instagramHackeado" &&
    hasAny(q, [
      "cambiaron mi correo",
      "cambiaron el correo",
      "cambiaron mi email",
      "cambiaron el email"
    ])
  ) {
    lastTopic = "instagramCorreo";
    return responses.instagramCorreo;
  }


  /* SEXTORSIÓN */

  if (
    lastTopic === "sextorsion" &&
    hasAny(q, [
      "y si soy menor",
      "si soy menor",
      "soy menor",
      "menor de edad"
    ])
  ) {
    return `
Si eres menor de edad, es todavía más importante que **no enfrentes la situación sola/o**. 💙

Guarda las pruebas, no envíes más contenido ni dinero, bloquea y reporta a la persona y cuéntaselo inmediatamente a un adulto de confianza.

Si existen amenazas, busca ayuda de las autoridades correspondientes.
`;
  }


  /* GROOMING */

  if (
    lastTopic === "grooming" &&
    hasAny(q, [
      "y si soy menor",
      "si soy menor",
      "soy menor",
      "tengo miedo"
    ])
  ) {
    return `
Si eres menor de edad y estás pasando por una situación de grooming, **no es tu culpa**. 💙

No continúes la conversación si te hace sentir incómoda/o, no envíes más información o imágenes y cuéntaselo inmediatamente a un adulto de confianza.

Guarda las evidencias antes de bloquear o reportar la cuenta.
`;
  }


  /* DATOS PERSONALES → DATOS SENSIBLES */

  if (
    lastTopic === "datosPersonales" &&
    hasAny(q, [
      "sensibles",
      "dato sensible",
      "datos sensibles"
    ])
  ) {
    lastTopic = "datosSensibles";
    return responses.datosSensibles;
  }


  return null;
}


/* =========================================================
   RESPUESTA PRINCIPAL
========================================================= */

function getBotResponse(question) {

  const q = normalizeText(question);


  /* SALUDOS */

  if (
    hasAny(q, [
      "hola",
      "holaa",
      "holaaa",
      "buenas",
      "buenos dias",
      "buenas tardes",
      "buenas noches"
    ])
  ) {
    lastTopic = "saludo";
    return responses.saludo;
  }


  /* AGRADECIMIENTO */

  if (
    hasAny(q, [
      "gracias",
      "muchas gracias",
      "te agradezco"
    ])
  ) {
    return `
¡De nada! 💙🇵🇪

Si tienes otra pregunta sobre derechos digitales, privacidad o ciberseguridad, puedes preguntarme.
`;
  }


  /* AYUDA */

  if (
    hasAny(q, [
      "ayuda",
      "que puedes hacer",
      "que sabes hacer"
    ])
  ) {
    lastTopic = "ayuda";
    return responses.ayuda;
  }


  /* CONTEXTO */

  const contextual = contextualResponse(q);

  if (contextual) {
    return contextual;
  }


  /* DETECTAR TEMA */

  const topic = detectTopic(q);

  if (topic && responses[topic]) {
    lastTopic = topic;
    return responses[topic];
  }


  return responses.desconocido;
}


/* =========================================================
   AGREGAR MENSAJE
========================================================= */

function addMessage(text, sender) {

  const chat = document.getElementById("chat");

  const message = document.createElement("div");
  message.className = "message " + sender;

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  bubble.innerHTML = text
    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
    .replace(/\n/g, "<br>");

  message.appendChild(bubble);
  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;
}


/* =========================================================
   ENVIAR MENSAJE
========================================================= */

function sendMessage() {

  const input = document.getElementById("userInput");
  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");

  input.value = "";

  setTimeout(() => {

    const response = getBotResponse(text);

    addMessage(response, "bot");

  }, 350);
}


/* =========================================================
   PREGUNTAS RÁPIDAS
========================================================= */

function quickQuestion(question) {

  const input = document.getElementById("userInput");

  input.value = question;

  sendMessage();
}


/* =========================================================
   ENTER PARA ENVIAR
========================================================= */

document.getElementById("userInput").addEventListener("keydown", function(event) {

  if (event.key === "Enter" && !event.shiftKey) {

    event.preventDefault();

    sendMessage();
  }

});
