<script>

  /* =========================================================
     CONFIGURACIÓN GENERAL
  ========================================================= */

  let lastTopic = null;


  /* =========================================================
     NORMALIZAR TEXTO
     Permite reconocer:
     "¿Qué es la Brecha Digital?"
     "brecha digital"
     "BRECHA DIGITAL"
     "brecha-digital"
     etc.
  ========================================================= */

  function normalizeText(text) {

    return text
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[¿?¡!.,;:()"']/g, " ")
      .replace(/[-_/]/g, " ")
      .replace(/\s+/g, " ")
      .trim();

  }


  /* =========================================================
     FUNCIONES AUXILIARES
  ========================================================= */

  function hasAny(text, words) {

    return words.some(word => text.includes(normalizeText(word)));

  }


  function hasAll(text, words) {

    return words.every(word => text.includes(normalizeText(word)));

  }


  /*
    Devuelve cuántas coincidencias tiene una lista de palabras.
  */

  function countMatches(text, words) {

    let count = 0;

    words.forEach(word => {

      if (text.includes(normalizeText(word))) {
        count++;
      }

    });

    return count;

  }

     RESPUESTAS POR TEMA
  ========================================================= */

    saludo: `

`,


    ayuda: `

🔐 Seguridad digital

⚖️ Derechos digitales

`,


    huellaDigital: `
La **huella digital** es el conjunto de rastros de información que una persona deja al utilizar Internet.

Puede incluir publicaciones, comentarios, fotografías, videos, búsquedas, cuentas, reacciones y otros datos asociados a su actividad digital.

Por eso es importante pensar antes de publicar y revisar periódicamente la privacidad de nuestras cuentas.
`,


    derechoOlvido: `
El **derecho al olvido** se relaciona con la posibilidad de solicitar, en determinadas circunstancias, que información personal que aparece en Internet deje de estar disponible o sea desindexada cuando existe una justificación legal para ello.

⚠️ No significa que cualquier persona pueda exigir automáticamente que se elimine absolutamente toda la información sobre ella. Se debe analizar el caso, el tipo de información, su relevancia, la fuente y los derechos involucrados.

En Perú, la protección de datos personales y los derechos relacionados con su tratamiento se encuentran regulados por la normativa de protección de datos personales.
`,


    netiqueta: `
La **netiqueta** es el conjunto de buenas prácticas para mantener una comunicación respetuosa y responsable en Internet.

Ante un desacuerdo en un foro, lo recomendable es:

• expresar la opinión sin insultar;
• responder a las ideas y no atacar a la persona;
• evitar provocaciones;
• utilizar un lenguaje respetuoso;
• aportar argumentos y fuentes cuando corresponda.

El objetivo es resolver las diferencias sin convertirlas en ataques personales.
`,


    doxing: `
El **doxing** consiste en recopilar y difundir información personal de una persona en Internet sin autorización, especialmente cuando se hace con la intención de exponerla, intimidarla o ponerla en riesgo.

Puede incluir datos como:
• dirección;
• teléfono;
• lugar de estudio o trabajo;
• información familiar;
• fotografías;
• otros datos que permitan identificar o localizar a una persona.

Puede vulnerar la privacidad y generar riesgos para la seguridad de la víctima.
`,


    derechoAutor: `
El **derecho de autor** protege las obras creadas por una persona, incluyendo determinadas fotografías, videos, textos, ilustraciones, música y otras creaciones.

Como regla general, no debemos asumir que porque una obra está publicada en Internet podemos copiarla, modificarla o volver a publicarla libremente.

Cuando corresponda, se debe contar con autorización del titular o aplicar una excepción legal.

En Perú, el Indecopi señala que existen derechos morales y patrimoniales sobre las obras fotográficas y mecanismos para protegerlas.
`,


    neutralidadRed: `
La **Neutralidad de la Red** es un principio regulatorio que busca proteger la libre elección de los usuarios del servicio de acceso a Internet.

En Perú fue adoptada mediante la Ley N.° 29904 y su reglamento.

En términos sencillos, busca que los usuarios puedan acceder legalmente a aplicaciones, protocolos, servicios y tráfico disponible en su conexión, evitando determinadas prácticas arbitrarias de bloqueo, interferencia, discriminación o restricción.

OSIPTEL regula este principio en el ámbito de las telecomunicaciones.
`,


    consentimientoImagenes: `
El **consentimiento informado** significa que una persona debe conocer qué se hará con su información o imagen y aceptar de manera válida cuando la ley exige su consentimiento.

Si quieres compartir una fotografía o video donde aparece otra persona identificable, debes tener en cuenta su privacidad, su derecho a la imagen y las normas de protección de datos que puedan resultar aplicables.

⚠️ No toda fotografía tomada en un lugar público puede publicarse automáticamente sin considerar los derechos de las personas que aparecen en ella.

Si aparecen menores de edad, se debe tener especial cuidado con su protección.
`,


    brechaDigital: `
La **Brecha Digital** se refiere a las desigualdades que existen entre personas o grupos respecto al acceso, uso y aprovechamiento de las tecnologías digitales.

El objetivo de los derechos de acceso y de las políticas de inclusión digital es **reducir esas desigualdades**, procurando que las personas puedan acceder a Internet, dispositivos, conectividad y conocimientos digitales.

Esto favorece la participación en áreas como:

📚 educación;
💼 trabajo;
🏥 salud;
🏛️ servicios públicos;
👥 participación social.

En resumen: busca que la tecnología no sea un privilegio limitado a determinados grupos.
`,


    arco: `
Los **derechos ARCO** son derechos relacionados con la protección de los datos personales:

🔹 **Acceso:** saber qué datos personales se tienen y cómo se están utilizando.

🔹 **Rectificación:** solicitar que los datos incorrectos o incompletos sean corregidos.

🔹 **Cancelación:** solicitar la eliminación de datos cuando corresponda legalmente.

🔹 **Oposición:** oponerse al tratamiento de datos personales en determinados casos.

Estos derechos forman parte del sistema peruano de protección de datos personales.
`,


    phishing: `
El **phishing** es una técnica utilizada para engañar a una persona y conseguir información como contraseñas, códigos o datos bancarios.

Por ejemplo, alguien puede enviar un mensaje que parece provenir de un banco, Instagram, TikTok o una empresa conocida y pedirte que ingreses a un enlace.

🚨 Si recibes uno:

• no abras enlaces sospechosos;
• no entregues códigos;
• verifica la dirección del sitio;
• cambia la contraseña si ingresaste tus datos;
• activa la autenticación de dos factores.
`,


    privacidad: `
La **privacidad digital** consiste en proteger la información personal que compartimos y la manera en que otras personas, empresas o plataformas pueden utilizarla.

Algunos datos que debemos proteger son:

• nombre y dirección;
• teléfono;
• fotografías;
• ubicación;
• contraseñas;
• información familiar;
• datos escolares;
• información financiera.

Revisa siempre las configuraciones de privacidad y evita compartir públicamente información innecesaria.
`,


    datosPersonales: `
Los **datos personales** son información que identifica o puede hacer identificable a una persona.

Por ejemplo:

• nombre;
• número telefónico;
• dirección;
• fotografía identificable;
• correo electrónico;
• ubicación;
• información relacionada con una persona.

En Perú existe una normativa específica para proteger los datos personales y regular su tratamiento.
`,


    ciberacoso: `
El **ciberacoso** es una forma de acoso realizada mediante medios digitales, como redes sociales, chats, videojuegos o plataformas de Internet.

Puede incluir:

• insultos repetidos;
• amenazas;
• humillaciones;
• difusión de contenido para avergonzar;
• exclusión intencional;
• creación de cuentas para burlarse de alguien.

Si eres víctima, conserva las evidencias, evita responder a las provocaciones, utiliza las herramientas de bloqueo y denuncia de la plataforma y busca apoyo de una persona adulta de confianza o de las autoridades cuando corresponda.
`,


    fotoEditadaAcoso: `
Si alguien publicó una **foto tuya editada para burlarse de ti**, puede tratarse de una situación de ciberacoso y también puede involucrar derechos relacionados con tu imagen y privacidad.

Te recomiendo:

1. 📸 Guarda capturas de pantalla.
2. 🔗 Guarda el enlace, nombre del grupo y perfil de quien publicó el contenido.
3. 🚩 Reporta la publicación o cuenta en WhatsApp u otra plataforma.
4. 🚫 Evita entrar en discusiones con la persona que lo publicó.
5. 👩‍🏫 Si eres menor de edad, cuéntaselo a una persona adulta de confianza.
6. 🚨 Si existen amenazas, hostigamiento grave o riesgos para tu seguridad, puedes acudir a las autoridades.

No borres las evidencias antes de guardarlas.
`,

1. 📸 Tomar capturas de la cuenta falsa.
2. 🔗 Guardar el enlace del perfil.
3. 🚩 Reportar la cuenta directamente en TikTok como suplantación.

5. 🔐 Revisar la seguridad de tus propias cuentas.
6. Si existen amenazas, fraude, extorsión o perjuicios graves, conservar las evidencias y acudir a las autoridades.
`,


    sextorsion: `
Si alguien te amenaza con **difundir fotos íntimas si no haces lo que te pide**, estás ante una situación grave que puede corresponder a sextorsión o extorsión sexual.

🚨 Lo más importante:

• **No pagues ni cumplas las exigencias.**
• No envíes más imágenes.
• Guarda capturas de las amenazas, perfiles, números y enlaces.
• No borres las conversaciones antes de conservar las evidencias.
• Reporta las cuentas en la plataforma.
• Busca ayuda de una persona adulta de confianza.

Si estás en Perú, puedes acudir a la **Policía Nacional**, a la **DIVINDAT** o utilizar los canales oficiales de denuncia del Ministerio del Interior.

Si eres menor de edad, recuerda que **no es tu culpa** y que pedir ayuda no significa que hayas hecho algo malo.

Si temes que alguien pueda hacerte daño inmediatamente, busca ayuda de emergencia.
`,


    chatsPrivados: `
Compartir capturas de conversaciones privadas para burlarse de otra persona **no debería considerarse simplemente una "pesadez" sin importancia**.

Dependiendo de lo que se haya compartido y de las circunstancias, puede involucrar derechos relacionados con:

• privacidad;
• datos personales;
• imagen;
• honor o reputación;
• intimidad.

No todos los casos constituyen automáticamente un delito: la calificación jurídica depende de los hechos concretos.

Si ocurre en un entorno escolar, también puede ser una situación de acoso o ciberacoso.
`,


    resubirContenido: `
Si otra página resube tus fotos o videos sin permiso, primero hay que distinguir qué tipo de contenido es y qué derechos tienes sobre él.

Si tú creaste una fotografía, video u otra obra original, puedes tener **derechos de autor** sobre esa creación.

Puedes:

• guardar capturas y enlaces;
• revisar si la plataforma ofrece un mecanismo de reclamación por copyright;
• solicitar el retiro del contenido cuando corresponda;
• identificar si la página obtuvo autorización o existe alguna excepción legal aplicable.

En Perú, Indecopi cuenta con mecanismos relacionados con la protección del derecho de autor.
`,


    controlParental: `
Los padres o responsables pueden utilizar herramientas de **control parental** para ayudar a proteger a sus hijos en Internet.

Estas herramientas pueden permitir:

• establecer límites de tiempo;
• filtrar determinados contenidos;
• administrar aplicaciones;
• controlar algunas configuraciones de seguridad;
• recibir información sobre determinados riesgos.

Pero la protección no debería basarse únicamente en vigilancia total. También es importante conversar con los hijos sobre privacidad, seguridad, límites y riesgos digitales.

La idea es combinar **protección + educación digital + respeto progresivo de la privacidad**.
`,


    grooming: `
El **grooming** ocurre cuando una persona adulta utiliza Internet para contactar y ganarse la confianza de un niño, niña o adolescente con una finalidad sexual o de explotación.

Si un desconocido contacta a una menor y le pide información personal:

🚨 No debe enviarle información, fotografías ni ubicación.

Conviene:

1. 📸 Guardar capturas de la conversación.
2. 🔗 Guardar el perfil y enlaces.
3. 🚫 No continuar la conversación si eso aumenta el riesgo.
4. 🚩 Reportar la cuenta en Instagram.
5. 👨‍👩‍👧 Buscar inmediatamente a una persona adulta de confianza.
6. ⚖️ Si existen indicios de grooming, acudir a las autoridades.

En Perú existen canales oficiales como la Central Única de Denuncias del Ministerio del Interior y servicios de orientación para situaciones que involucren a menores.
`,


    derechoImagen: `
El **derecho a la imagen** protege frente al uso de la imagen de una persona en determinadas circunstancias.

Si tomas una fotografía en la calle y aparece otra persona, eso **no significa automáticamente que esté prohibido publicarla**, pero tampoco significa que puedas hacer cualquier uso de ella sin considerar derechos.

Hay que tener en cuenta factores como:

• si la persona es identificable;
• cuál es el contexto de la fotografía;
• para qué quieres utilizarla;
• si la persona es el elemento principal de la imagen;
• si existe algún perjuicio;
• si hay menores de edad.

Por eso, si una persona aparece claramente como protagonista de la fotografía, es recomendable contar con su autorización antes de publicarla, especialmente si el uso puede afectar su privacidad o reputación.
`,


    testigoAcoso: `

• guardar evidencias si hacerlo es seguro;
• reportar la publicación o cuenta;
• avisar a una persona adulta, docente o responsable;
• acompañar a la víctima para que busque ayuda;
• evitar enfrentarte directamente al agresor si eso puede ponerte en riesgo.

Ser testigo no significa que tengas que convertirte en el objetivo del agresor. Puedes intervenir de forma segura y responsable.
`,


    identidadDigital: `

  function detectTopic(q) {

    if (hasAny(q, [

  /* =========================================================

  ========================================================= */

  function contextualResponse(q) {

    if (!lastTopic) return null;


    /* FOLLOW-UP PARA INSTAGRAM */

    if (lastTopic === "instagramHackeado") {

      if (
        hasAny(q, [
          "cambiaron mi correo",
          "cambio el correo",
          "cambiaron el email",
          "correo cambiado"
        ])
      ) {

        lastTopic = "instagramCorreo";

        return responses.instagramCorreo;

      }

    }


    /* FOLLOW-UP PARA SEXTORSIÓN */

    if (lastTopic === "sextorsion") {

      if (
        hasAny(q, [
          "tengo miedo",
          "que hago",
          "qué hago",
          "y si publica",
          "si lo publica",
          "no quiero decirle a nadie"
        ])
      ) {

        return `

Si existe un peligro inmediato, busca ayuda de emergencia.
`;

    if (lastTopic === "grooming") {

          "como denuncio",

6. Puedes acudir a la Policía Nacional o utilizar los canales oficiales de denuncia.

Si hay riesgo inmediato para la menor, busca ayuda urgente.
`;

      }

    }


    return null;

  }


  /* =========================================================
     OBTENER RESPUESTA
  ========================================================= */

  function getBotResponse(question) {

    const q = normalizeText(question);


    /* SALUDOS */

    if (
      hasAny(q, [
        "hola",
        "holaa",
        "holaaa",
        "buenas",
        "buenos dias",
        "buenas tardes",
        "buenas noches"
      ])
    ) {

      lastTopic = null;
      return responses.saludo;

    }


    /* AGRADECIMIENTOS */

    if (
      hasAny(q, [
        "gracias",
        "muchas gracias",
        "te agradezco"
      ])
    ) {

      return `
¡De nada! 💙🇵🇪

Si tienes otra pregunta sobre derechos digitales, privacidad o seguridad en Internet, puedes escribírmela.
`;

    }


    /* AYUDA */

    if (
      hasAny(q, [
        "que puedes hacer",
        "qué puedes hacer",
        "ayuda",
        "que temas conoces",
        "qué temas conoces"
      ])
    ) {

      return responses.ayuda;

    }


    /* PRIMERO: CONTEXTO */

    const contextual = contextualResponse(q);

    if (contextual) {
      return contextual;
    }


    /* SEGUNDO: DETECTAR TEMA */

    const topic = detectTopic(q);


    if (topic) {

      lastTopic = topic;

      return responses[topic] || responses.desconocido;

    }


    /* TERCERO: PREGUNTAS GENERALES */

    if (
      hasAny(q, [
        "que es",
        "qué es",
        "en que consiste",
        "en qué consiste",
        "cual es",
        "cuál es",
        "que significa",
        "qué significa"
      ])
    ) {

      return responses.desconocido;

    }


    return responses.desconocido;

  }


  /* =========================================================
     MOSTRAR MENSAJES
  ========================================================= */

  function addMessage(text, sender) {

    const chat = document.getElementById("chat");

    const message = document.createElement("div");
    message.className = "message " + sender;

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    bubble.textContent = text.trim();

    message.appendChild(bubble);
    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;

  }


  /* =========================================================
     ENVIAR MENSAJE
  ========================================================= */

  function sendMessage() {

    const input = document.getElementById("userInput");

    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");

    input.value = "";

    setTimeout(() => {

      const response = getBotResponse(text);

      addMessage(response, "bot");

    }, 300);

  }


  /* =========================================================
     BOTONES DE SUGERENCIAS
  ========================================================= */

  function quickQuestion(question) {

    const input = document.getElementById("userInput");

    input.value = question;

    sendMessage();

  }


  /* =========================================================
     ENTER PARA ENVIAR
  ========================================================= */

  document
    .getElementById("userInput")
    .addEventListener("keydown", function(event) {

      if (event.key === "Enter" && !event.shiftKey) {

        event.preventDefault();

        sendMessage();

      }

    });


  /* =========================================================
     MENSAJE INICIAL
  ========================================================= */

  addMessage(`
¡Hola! 👋🇵🇪 Soy LawsBot Perú.

Estoy aquí para orientarte sobre derechos digitales, privacidad, ciberseguridad y convivencia digital.

Puedes hacerme una pregunta directamente o contarme un caso concreto. 💙
`, "bot");
